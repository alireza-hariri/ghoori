<?xml version="1.0" encoding="UTF-8"?>
<!-- Ghoori app icon: the teapot from the start screen (src/icons.rs) on a rounded tile.
     Teapot geometry is in units of its size s, centred on the origin. -->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c2c35"/>
      <stop offset="1" stop-color="#16161b"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="54" fill="url(#bg)"/>
  <g transform="translate(124.6 157) scale(150)" fill="#e6e1d7">
    <!-- Steam -->
    <g fill="none" stroke="#e6e1d7" stroke-opacity="0.5" stroke-width="0.04" stroke-linecap="round">
      <path d="M -0.12 -0.58 C -0.094 -0.58 -0.106 -0.72 -0.08 -0.72"/>
      <path d="M 0.06 -0.58 C 0.086 -0.58 0.074 -0.80 0.10 -0.80"/>
    </g>
    <!-- Spout and handle sit behind the body -->
    <path d="M 0.32 0.08 L 0.62 -0.2" stroke="#e6e1d7" stroke-width="0.11"/>
    <circle cx="0.62" cy="-0.2" r="0.055"/>
    <path d="M -0.42 0.19 A 0.17 0.17 0 0 1 -0.42 -0.15" fill="none" stroke="#e6e1d7" stroke-width="0.08"/>
    <ellipse cx="0" cy="0.05" rx="0.45" ry="0.36"/>
    <!-- Lid, knob and band -->
    <path d="M -0.22 -0.24 A 0.22 0.22 0 0 1 0.22 -0.24 Z"/>
    <circle cx="0" cy="-0.48" r="0.07" fill="#f2a541"/>
    <rect x="-0.44" y="-0.02" width="0.88" height="0.1" rx="0.05" fill="#f2a541"/>
  </g>
</svg>
