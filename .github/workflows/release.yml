name: Release

# Push a tag like v0.2.0 (matching the version in Cargo.toml) to build and publish a release.
on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-24.04
    # Built on Debian 12 so the binary runs on any distro with glibc >= 2.36 and libmpv.so.2
    # (the user still needs mpv >= 0.38 installed).
    container: debian:bookworm
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git build-essential cmake clang \
            pkg-config libmpv-dev libwayland-dev libxkbcommon-dev wayland-protocols libx11-dev \
            libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl-dev

      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Check the tag matches Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $version" >&2
            exit 1
          fi

      - name: Build
        run: cargo build --release --locked

      - name: Test
        run: cargo test --release --locked

      - name: Package
        run: |
          name=ghoori-x86_64-linux
          mkdir -p "$name/icons"
          strip -o "$name/ghoori" target/release/ghoori
          cp install.sh ghoori.desktop README.md LICENSE "$name/"
          cp icons/ghoori.svg icons/ghoori.png icons/ghoori-256.png "$name/icons/"
          tar czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: ghoori-x86_64-linux.tar.gz*

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "Ghoori $GITHUB_REF_NAME" \
            --generate-notes ghoori-x86_64-linux.tar.gz ghoori-x86_64-linux.tar.gz.sha256
